lifecycle_quality_gates_version: 1

purpose:
  - "Keep coding agents aligned from idea to release without turning every prototype into a full production project."
  - "Make security, package safety, testability, and handoff evidence proportional to maturity level."

principles:
  just_enough_artifacts: "Produce the minimum evidence needed for the current maturity level, then escalate only when risk requires it."
  safe_by_default: "Prefer approved tracks, golden templates, standard libraries, and approved packages."
  replacement_before_exception: "When a package, runtime, plugin, or architecture is blocked, suggest a safe replacement before asking for an exception."
  evidence_not_approval: "MCP and checker outputs are evidence; official approval remains with the institution."
  keep_user_at_business_level: "Ask civil servants about users, data, and 업무흐름; do not make them choose frameworks or package managers."
  two_report_release_default: "For release readiness, the default submission package is the two files saved by vibecode-checker: a human-readable HTML report and a JSON evidence report. Extra application forms are conditional, not default."

checker_profiles:
  quick:
    when: "During coding, after risky changes, before commit/save when requested, or when adding a dependency."
    goal: "Keep the user moving while catching only the highest-value safety rails."
    scope:
      - "changed source files or small targeted paths"
      - "new or changed dependency manifests"
    required_controls:
      - "new package, denied package, not_found, registry_rejected, malicious, in_kev"
      - "hardcoded secrets and personal/sensitive sample data"
      - "external API/CDN/LLM/MCP calls added outside policy"
      - "SQL injection, file upload path/extension/size risks, eval/command execution, unsafe deserialization"
      - "implementation language, DBMS, runtime, or server profile drift from institution policy"
    user_output: "Silent pass; one short action sentence on block/warn. Do not expose internal checker fields."
    avoid:
      - "full project rescan on simple UI/text changes"
      - "creating release documents"

  standard:
    when: "After implementation is functionally complete, before release readiness."
    goal: "Check the full source and declared dependencies before the project is treated as a release candidate."
    required_tools:
      - "scan_path on _workspace/source or the provided source path"
      - "scan_dependencies for requirements/package/lock files"
      - "suggest_fix for unresolved block/high issues when useful"
    required_checks:
      - "scanned_file_count > 0"
      - "critical/high/block findings resolved or explicitly routed to reviewer"
      - "health or smoke test recorded"

  full:
    when: "Before deployment, official development environment handoff, security review request, or AX/security team submission."
    goal: "Create final checker evidence without producing unnecessary harness paperwork."
    required_tools:
      - "scan_path"
      - "scan_dependencies for manifests/lockfiles"
      - "scan_installed_packages when .venv, node_modules, wheel, or installed inventory exists"
      - "scan_vendor_bundles when scan_path returns vendor_bundles"
      - "render_report(format='both', save=true)"
    merge_rule: "Merge dependency, installed-package, and vendor-bundle audits into dependency_audit before render_report."
    default_submission_files:
      - "vibecode-checker saved HTML report"
      - "vibecode-checker saved JSON evidence report"
    mandatory_user_notice: "Tell the user that the two final checker reports must be submitted to the security team or AX team. They are evidence for review, not official approval."
    conditional_documents_only:
      - "deployment application form when the institution requires a form"
      - "exception request when unresolved exceptions exist"
      - "package review request when package review is required"
      - "server install summary when operations needs installation handoff"

stages:
  idea:
    goal: "Clarify the 업무 problem, users, data, exposure, and success shape."
    minimum_outputs:
      - "_workspace/00_feature_brief.md"
      - "manifest.work_mode"
      - "manifest.maturity_level"
    gate:
      pass_when:
        - "user_scope_known"
        - "data_level_estimated"
      escalate_when:
        - "citizen_access"
        - "personal_or_sensitive_data"
        - "file_upload"
        - "persistent_database"

  design:
    goal: "Select approved track, runtime, DBMS, network profile, and package boundaries."
    minimum_outputs:
      - "_workspace/01_PRD_서비스기획서.md"
      - "_workspace/02_화면_기능설계서.md"
      - "_workspace/04_개발스택_운영환경.md"
    gate:
      pass_when:
        - "approved_track_selected"
        - "runtime_policy_applied"
        - "package_policy_boundary_recorded"
      block_when:
        - "unapproved_dbms_without_alternative"
        - "external_saas_dependency_without_exception"

  implementation:
    goal: "Implement only inside approved golden templates and preserve feature delivery when replacing unsafe dependencies."
    minimum_outputs:
      - "_workspace/source/"
      - "manifest.dependencies"
      - "manifest.gates.dev_ready"
    gate:
      pass_when:
        - "source_inside_workspace"
        - "golden_template_used"
        - "no_denied_package"
        - "blocked_package_has_replacement_or_exception"
        - "quick_checker_used_only_for_risky_changes_or_user_request"
      block_when:
        - "new_framework_without_track"
        - "denied_package_without_replacement"
        - "runtime_external_access_added_without_policy"

  test:
    goal: "Run standard security and quality checks after implementation is complete, before release readiness."
    minimum_outputs:
      - "_workspace/05_보안점검보고서.md"
      - "manifest.security_check"
      - "manifest.gates.security_status"
    gate:
      pass_when:
        - "scan_path_or_equivalent_completed"
        - "dependencies_checked_or_marked_needs_review"
        - "health_or_smoke_test_recorded"
        - "checker_profile_standard_recorded"
      block_when:
        - "critical_or_high_unresolved"
        - "dependency_scan_missing_for_L2_or_L3"
        - "scanned_file_count_zero"

  release:
    goal: "Run full checker validation and prepare the minimum two-report submission for security/AX review without claiming official approval."
    minimum_outputs:
      - "vibecode-checker saved HTML report path"
      - "vibecode-checker saved JSON evidence path"
      - "manifest.security_check.full_report_paths"
      - "user_notice.final_reports_must_be_submitted"
    conditional_outputs:
      - "_workspace/07_서버설치_배포가이드.md when operations install handoff is requested"
      - "_workspace/08_배포신청서.md when the institution requires a form"
      - "_workspace/09_예외신청서.md when exception approval is required"
      - "_workspace/10_패키지예외신청서.md or 11_패키지검토요청서.md when package review is required"
      - "dist/ when the user asks for a packaged handoff archive"
    gate:
      pass_when:
        - "full_checker_html_and_json_saved"
        - "full_security_evidence_present"
        - "deployment_environment_matches_profile"
        - "package_registry_or_review_status_recorded"
        - "final_report_submission_notice_given"
      block_when:
        - "full_checker_html_or_json_missing"
        - "full_checker_not_run_for_release"
        - "official_approval_claimed_by_harness"
        - "production_deploy_without_user_request"

balance_checks:
  too_light:
    - symptom: "L2 or L3 with no dependency evidence"
      action: "block and request scan_dependencies or registry evidence"
    - symptom: "feature implemented with new package but no reason or alternative review"
      action: "warn for L1, block for L2/L3"
    - symptom: "security report says safe when no files were scanned"
      action: "block"
  too_heavy:
    - symptom: "L1 idea/prototype forced to complete deployment application forms"
      action: "downgrade to feature brief, manifest, source, quick check"
    - symptom: "Release flow creates deployment application, exception forms, package evidence JSON, and server guide when the checker two-report submission is enough"
      action: "keep only checker HTML/JSON as default; create extra forms only on explicit institutional need or unresolved exception"
    - symptom: "public-sector legal approval language used for a prototype"
      action: "replace with ready-for-review wording"
    - symptom: "user is asked to choose framework, package manager, or DBMS"
      action: "agent decides from institution profile and asks only 업무 questions"

manifest_expectations:
  required_common:
    - "work_mode"
    - "maturity_level"
    - "service_exposure"
    - "network_profile"
    - "track"
    - "gates"
  package_fields:
    - "dependencies.requested"
    - "dependencies.approved"
    - "dependencies.replaced"
    - "dependencies.needs_review"
    - "dependencies.denied"
