harness_enforcement_contract_version: 1

purpose:
  - "Define the runtime contract between the harness, vibecode-checker(gvskb), and the trusted package registry."
  - "Make the harness the user-side enforcement layer: it blocks, warns, or allows agent actions based on checker verdicts."
  - "Keep package analysis and registry governance outside the harness implementation."

role_separation:
  harness:
    responsibility:
      - "Constrain AI coding agents and users before package install/use, code generation, test, and release handoff."
      - "Call vibecode-checker/gvskb for package and security evidence when dependencies or release gates are involved."
      - "Translate checker verdicts into pass/warn/block decisions according to this contract and the institution profile."
      - "Show a safe next action whenever blocking occurs."
    must_not:
      - "Directly call the registry service as a normal package decision path."
      - "Invent package safety analysis when checker evidence is missing."
      - "Declare official security approval or final package approval."
      - "Silently approve, reject, or update the official registry catalog."
  vibecode_checker:
    responsibility:
      - "Analyze code and manifests."
      - "Query the registry service when registry-backed package governance is available."
      - "Combine registry status, vulnerability intelligence, malicious-package signals, cooldown, and cache freshness into a single verdict."
      - "Return evidence fields that the harness can enforce."
    output_role: "evidence_and_verdict_provider"
  registry_service:
    responsibility:
      - "Store institution package allow/deny/review decisions for PyPI and npm packages."
      - "Manage approved, rejected, under-review, cooldown, conditional, and stale states."
      - "Provide source-of-truth package governance to vibecode-checker."
    output_role: "governance_source_of_truth"
  human_or_platform_reviewer:
    responsibility:
      - "Make final approval, rejection, exception, and condition decisions."

implementation_language_policy:
  allowed_function_implementation_languages:
    - python
    - javascript
    - typescript
  allowed_runtimes:
    python: "CPython versions declared in shared/institution-profile.yaml"
    javascript: "Node.js versions declared in shared/institution-profile.yaml, plus browser JavaScript for approved React/Vite frontend tracks"
    typescript: "TypeScript source compiled by the approved Node.js toolchain; checker scans .ts and .tsx source"
  not_allowed_without_exception:
    - java
    - kotlin
    - go
    - php
    - ruby
    - csharp
    - rust
    - dart
    - swift
    - native_binary_runtime
  typescript_policy: "TypeScript is an approved implementation source for approved React/Vite and Node tracks. TypeScript dependency changes are npm ecosystem changes and must pass the npm package gate."
  enforcement_rule: "If a requested implementation needs a non-Python/non-JavaScript/non-TypeScript language, mark needs-review and suggest an approved Python, JavaScript, or TypeScript track instead."

checker_call_contract:
  registry_access: "checker-mediated-only"
  profile_policy:
    default_source: "vibecode-checker built-in profiles"
    harness_policy_copies: "not used unless an institution explicitly creates custom policies"
    custom_policy_dir_rule: "GVSKB_POLICIES_DIR must be an absolute path; relative paths such as .claude/references/policies are not valid for MCP runtime."
    network_profile_namespace: "network_profile values such as admin-network/dmz-public/internet-prototype are deployment/network classifications, not checker scan profiles."
    required_verification: "After scan_path, compare requested_checker_profile with the returned report.profile/applied profile; mismatch means security validation is incomplete."
    profile_fallback_rule: "If checker returns non-null profile_fallback, treat the scan as fallback evidence only and mark security validation incomplete."
    mcp_command_rule: "Use gvskb-server or python -m gvskb.server; gvskb mcp is invalid."
    mcp_json_encoding_rule: "Root .mcp.json and compatibility MCP JSON files must be UTF-8 without BOM and include PYTHONUTF8=1, PYTHONIOENCODING=utf-8. GVSKB_MODE=offline is allowed only for confirmed air-gapped/offline environments."
    codex_mcp_config_rule: "ChatGPT desktop Codex, Codex CLI, and Codex IDE read .codex/config.toml or user-level ~/.codex/config.toml [mcp_servers.*], not .mcp.json."
    claude_desktop_config_rule: "Claude Desktop does not automatically share Claude Code project MCP settings; connect it with Desktop Extension or .mcpb packaging."
  normal_path:
    - "For package decisions, call vibecode-checker/gvskb; do not call registry directly."
    - "For new PyPI packages, use shared/enforcement/gvskb_gate.py check/install before pip install."
    - "For new npm packages, use shared/enforcement/gvskb_gate.js check/install before npm install; default to --ignore-scripts."
    - "For JavaScript and TypeScript dependency changes, direct npm/pnpm/yarn installs are harness bypasses unless the checker gate has passed first."
    - "Package gates must call audit_manifest, including for single package checks converted into temporary manifests, so version, manifest, and registry-backed context are preserved."
    - "Use verify-manifest for development-time manifest checks; this is not a final release report."
    - "Use scan_dependencies for manifest/lockfile decisions and package-oriented gates."
    - "Use scan_path for source security checks."
    - "Use scan_installed_packages in full release checks when .venv, node_modules, wheels, or installed inventories exist."
    - "Use scan_vendor_bundles in full release checks when scan_path returns vendor_bundles."
    - "Use render_report(format='both', save=true) for release readiness and preserve the checker-saved paths."
    - "Use checker verdict fields as the enforcement input."
  audit_metadata_to_send_when_supported:
    caller: "harness:auto"
    request_type: "AUTO or MANUAL"
    project_id: "non-personal project identifier"
    maturity_level: "L0/L1/L2/L3/L4"
    env_grade: "E0/E1/E2/E3"
    track: "approved track id"
    requested_package: "ecosystem/name/version when applicable"
  personal_data_rule: "Do not send requester name, personal email, employee id, resident registration number, secrets, source code unrelated to the scan, or private tokens as audit metadata."

required_checker_fields:
  package_level:
    - verdict
    - verdict_severity
    - requires_review
    - checked
    - is_malicious_package
    - in_kev
    - kev_checked
    - max_cve
    - cooldown.ok
    - version_exact
    - source_scope
    - registry_status
    - registry_decision
    - registry_stale
    - heuristics.typosquat_warning
  manifest_level:
    - truncated_count
    - unchecked_count
    - intel_cache.state
    - registry_status
    - source_kind

verdict_priority:
  - malicious
  - registry_rejected
  - not_found
  - vulnerable
  - cooldown_hold
  - checked_stale
  - registry_approved
  - checked_clean
  - unknown
  - error

absolute_block:
  regardless_of_mode:
    - "verdict == malicious"
    - "verdict == registry_rejected"
    - "verdict == not_found"
    - "in_kev == true"
  notes:
    not_found: "Official registry absence is not a heuristic. Treat it as a likely hallucinated or slopsquatting-prone package name and block before install."
    stale_rejected_cache: "If a cached registry rejection is stale or registry is unreachable, keep blocking. Show that the rejection is stale/current registry confirmation failed; do not downgrade to warning."
    kev_checked: "If kev_checked == false, in_kev == false does not mean no known exploitation; it means KEV comparison was not performed."

checker_signal_updates_2026_08_03:
  kev_checked:
    meaning: "Whether KEV comparison actually ran for this package result."
    enforcement:
      - "If in_kev == true, always block."
      - "If kev_checked == false and in_kev == false, do not use in_kev=false as pass evidence."
      - "If kev_checked is absent, treat cisa-kev in cache_sources_used as the only fallback proof that KEV comparison ran; other cache sources such as osv-malicious do not prove KEV comparison."
      - "In ENFORCE, hold or block install when KEV comparison is unavailable unless another fresh safe verdict and institution policy explicitly allow."
      - "In MONITOR/WARN, record the degraded evidence path for staff, but do not show cache/source internals to the ordinary user."
  version_exact:
    meaning: "Whether the checked version is an observed exact version rather than a manifest boundary assumption such as >=2.28."
    enforcement:
      - "version_exact == false cannot be the only reason to block installation."
      - "Boundary-version vulnerability evidence may warn or require review, but should not create a standalone block."
      - "Absolute package-name/package-identity rules such as malicious, not_found, registry_rejected, and in_kev still apply regardless of version_exact."
  source_scope:
    allowed_values:
      - single
      - manifest
      - lockfile
      - installed
    enforcement:
      - "single and manifest are direct human-selected dependencies."
      - "lockfile and installed are transitive or observed dependencies unless the checker marks them as direct."
      - "In ENFORCE, unknown blocks only for source_scope single or manifest."
      - "In ENFORCE, unknown on lockfile or installed is recorded/reported but not blocked by unknown alone; absolute rules still block."
  registry_stale:
    meaning: "The checker is returning an old registry block or degraded registry result."
    enforcement:
      - "registry_stale == true does not change a block into a warning."
      - "Use registry_stale for staff audit/detail, not ordinary user-facing field display."
  registry_status:
    allowed_values:
      - ok
      - unreachable
      - rejected
      - item_failed
      - unauthorized
      - disabled
    enforcement:
      - "Only registry_status == ok means an institution registry decision was available."
      - "Any registry_status other than ok is treated as no institution decision for allow purposes."
      - "Do not enumerate unknown future registry_status values as pass; unknown values must be treated as no institution decision."

enforcement_modes:
  default_mode: MONITOR
  mode_owner: "institution security/operations policy"
  initial_rollout:
    recommended_default: MONITOR
    recommended_transition: "MONITOR for 2 weeks, then WARN after security/operations confirmation."
    reason: "If the registry has little or no real package data, most packages return unknown; starting in WARN/ENFORCE can create warning fatigue or bypass culture."
  modes:
    MONITOR:
      meaning: "Record and report findings. Do not block except absolute_block cases."
      recommended_for: "Initial observation period or incomplete registry rollout."
    WARN:
      meaning: "Block high-risk and absolute-block cases, warn on uncertain or stale evidence."
      recommended_for: "Early operational default for public-sector vibe coding."
    ENFORCE:
      meaning: "Fail safe on unknown/error/cooldown and block medium+ dependency risk."
      recommended_for: "Registry/checker coverage is operationally reliable."
  enforce_transition_criteria:
    initial_values:
      direct_dependency_unknown_ratio: "10% or less"
      version_level_registered_count: 200
      observation_period: "3 consecutive weeks"
    rule: "All criteria must be met, then security/operations reviews the transition. Do not switch to ENFORCE automatically."
    denominator: "direct dependencies only: source_scope single or manifest"

checker_effort_profiles:
  quick:
    purpose: "During coding, catch essential safety rails without slowing the user or spending unnecessary tokens."
    checker_profile: "dev-quick"
    trigger: "Risky code/dependency changes or explicit user request such as pre-commit/midpoint check."
    scope: "Changed files, requested snippet/path, and changed dependency manifests only."
    must_check:
      - "new package, denied/not_found/registry_rejected/malicious/in_kev dependencies"
      - "hardcoded secrets and personal/sensitive sample data"
      - "external API/CDN/LLM/MCP additions outside policy"
      - "SQL injection, file upload risk, eval/command execution, unsafe deserialization"
      - "language, DBMS, runtime, or server-profile drift from institution policy"
    user_message: "Silent pass; one short action-oriented line for block/warn."
  standard:
    purpose: "After implementation completion, validate full source and declared dependencies before release readiness."
    required: "scan_path on source plus scan_dependencies for manifest/lockfile evidence."
    blocks: "unresolved critical/high/block findings, missing dependency evidence for L2+, or scanned_file_count == 0."
  full:
    purpose: "Before deployment/security/AX submission, create final checker evidence and the default two-report submission."
    required_tools:
      - scan_path
      - scan_dependencies
      - scan_installed_packages_when_inventory_exists
      - scan_vendor_bundles_when_vendor_bundles_exist
      - render_report_both_save_true
    merge_rule: "Merge dependency, installed-package, and vendor-bundle audits into dependency_audit before rendering."
    default_final_submission:
      - "vibecode-checker saved HTML report"
      - "vibecode-checker saved JSON evidence report"
    user_notice_required: "The user must be told to submit the two final reports to the security team or AX team. The reports are evidence for review, not official approval."
    no_extra_documents_by_default: true

mode_decision_table:
  vulnerable_critical_or_high:
    MONITOR: warn
    WARN: block
    ENFORCE: block
  vulnerable_medium_or_low:
    MONITOR: log
    WARN: warn
    ENFORCE: block
  vulnerable_unknown_severity:
    MONITOR: warn
    WARN: warn
    ENFORCE: block
  cooldown_hold:
    MONITOR: log
    WARN: warn
    ENFORCE: block
  checked_stale:
    MONITOR: log
    WARN: warn
    ENFORCE: warn
  unknown_or_error:
    condition: "source_scope missing or tool-level failure where direct/transitive scope cannot be determined"
    MONITOR: log
    WARN: warn
    ENFORCE: block
  unknown_direct_dependency:
    condition: "verdict unknown/error with source_scope single or manifest"
    MONITOR: log
    WARN: warn
    ENFORCE: block
  unknown_transitive_or_installed:
    condition: "verdict unknown with source_scope lockfile or installed"
    MONITOR: log
    WARN: warn
    ENFORCE: warn
  registry_approved_checked_true:
    MONITOR: pass
    WARN: pass
    ENFORCE: pass
  registry_approved_checked_false:
    MONITOR: pass
    WARN: warn
    ENFORCE: warn
  checked_clean:
    MONITOR: pass
    WARN: pass
    ENFORCE: pass
  existing_package_typosquat_warning:
    MONITOR: warn
    WARN: warn
    ENFORCE: warn

environment_grades:
  default_for_personal_pc_harness: E1
  default_for_internal_server_or_ci: E2
  grades:
    E0:
      meaning: "Personal PC, one-time/local experiment, public or dummy data only."
      cooldown_days: 3
      auto_approval_possible: true
    E1:
      meaning: "Personal PC repeated tool or internal document/data handling."
      cooldown_days: 7
      auto_approval_possible: true
    E2:
      meaning: "Internal server, shared runtime, administrative information, or CI/CD."
      cooldown_days: 14
      auto_approval_possible: false
      requires_human_review: true
    E3:
      meaning: "Citizen-facing, personal/sensitive data, authentication, payment, or core administrative decisioning."
      cooldown_days: 14
      auto_approval_possible: false
      requires_human_review: true
      harness_position: "The harness may prepare evidence and code, but cannot authorize operation."
  transition_rules:
    - "Harness determines env_grade from runtime, exposure, data, and deployment target; do not ask the developer to self-declare a lower grade."
    - "E1 to E2 upgrade is allowed without approval."
    - "E1 to E0 downgrade requires reason and approval record."
    - "Always display the applied env_grade in the manifest and package/security reports."

local_catalog_and_registry_priority:
  rules:
    - "Local deny/block always wins over local allow."
    - "If registry_decision is REJECTED or verdict is registry_rejected, block even when local allow lists the package."
    - "If local deny blocks a package, block regardless of registry approval."
    - "If local allow and checker returns registry_approved/checked_clean, pass."
    - "If local allow but checker returns unknown, under_review, cooldown_hold, checked_stale, error, or checked=false, apply mode_decision_table."
    - "If no local catalog entry but checker returns registry_approved/checked_clean, pass."
    - "If no local catalog entry and checker returns unknown/error, apply mode_decision_table and propose a replacement."
  catalog_export_for_registry:
    approved_packages_file: "shared/references/approved-packages.yaml"
    denied_packages_file: "shared/references/package-denylist.yaml"
    export_rule: "When sharing a package catalog with the registry, denylist package names become REJECTED, but name-only approved/restricted entries are scope hints and must not become registry APPROVED without an exact version and checker evidence."
    reason: "Registry APPROVED is a version-level decision. Importing name-only allowlist entries as APPROVED would approve every version of that package."
    denied_patterns: "Pattern rules such as CDN/eval/postinstall stay in the harness gate; they are not registry package decisions."
    restricted_conditions: "Restricted names need enforceable conditions before registry conditional decisions can be created."

freshness_policy:
  asymmetric_rule: "Require fresh evidence before becoming less strict; do not require fresh evidence to remain strict."
  pass_freshness_target: "1 hour for pass/allow decisions unless institution policy changes it after operations data."
  allow_or_pass_decision:
    stale_or_expired: "Retry checker/registry lookup before pass."
    retry_failed: "Do not pass; treat as unknown/error according to mode."
  block_decision:
    stale_or_expired: "Retry checker/registry lookup when possible."
    retry_failed: "Keep the older block with stale notation."
  stale_rejected_cache: "A stale registry rejection remains a block until a fresh non-rejected verdict is obtained."
  rationale: "If stale block decisions are downgraded on network failure, absolute/rejected blocks become easier to bypass during outage or offline work."

typosquat_policy:
  harness_action: "Warn only for an existing package with heuristics.typosquat_warning. Do not block solely on typosquat heuristics."
  registry_action: "Registry may withhold automatic approval and return UNDER_REVIEW when typosquat heuristics are present."
  not_found_overlap: "If the package is not found in the official registry, apply the absolute not_found block instead of the typosquat warning rule."
  rationale: "Typosquat detection is heuristic and can create false positives as the comparison corpus grows; warning is appropriate for harness enforcement, human review is appropriate for registry approval."

bypass_policy:
  allowed_for:
    - "unknown"
    - "error"
    - "checked_stale"
    - "cooldown_hold when institution policy allows manual review path"
    - "vulnerable medium_or_low with compensating control and reviewer path"
  never_allowed_for:
    - "malicious"
    - "registry_rejected"
    - "not_found"
    - "in_kev"
    - "local catalog denied package"
  reason_code_required: true
  free_text_reason: "not allowed as the primary reason; optional detail must not contain personal data"
  monthly_report_required: true
  preapproved_reason_codes:
    - "DEV_ONLY_NO_RUNTIME_USE"
    - "OFFLINE_EVIDENCE_PENDING"
    - "SECURITY_REVIEW_TICKET_OPENED"
  unrecognized_reason_code_handling: "Keep the override record with a warning audit log rather than dropping the fact that a bypass occurred."
  approval_ref_validation: "Reject approval_ref values that contain email, IP address, person name, employee id, or other personal identifiers."
  structured_override_shape:
    reason_code: "one of the approved reason codes; no free text as the primary value"
    approval_ref: "document/ticket number, not a person name"
    mode: "MONITOR/WARN/ENFORCE"
    expires_at: "default 7 days when institution enables overrides"
  pending_3_party_policy:
    - "gvskb proposes that not_found may be overridden for private/internal registry packages with structured override or internal package prefixes."
    - "Registry response 2026-08-03 accepts the harness position that absolute blocks and catalog denied packages are not bypassable by code."
    - "Until a later three-party change, the harness defaults to blocking not_found and routing private-package cases to reviewer/internal-prefix policy instead of install."

conditional_approval_enforcement:
  rule: "If checker/registry returns conditions such as --ignore-scripts, pinned version, internal mirror only, no external API, or dev-only use, the harness may allow only when it can enforce and record every condition."
  cannot_enforce: "If any condition cannot be enforced by the selected tool/runtime, treat as block or needs-review according to mode."

hash_and_integrity_policy:
  hash_mismatch: "If name/version match but package hash differs from approved evidence, block in WARN/ENFORCE and mark needs human review."
  lockfile_required_for_release: "L2/L3/L4 handoff requires pinned versions and lockfiles where the ecosystem supports them."
  npm_install_rule: "Prefer npm ci --ignore-scripts from a lockfile for reviewed projects."

block_response_contract:
  ordinary_user_message:
    principle: "Keep the screen simple. More checker fields must not mean more user-facing complexity."
    pass: "Show nothing."
    block: "Show one short action sentence: what cannot be installed and what to do next."
    system_problem: "Do not expose registry outage, cache missing, kev_checked, source_scope, or internal field names to ordinary users; route staff detail to the report/manifest."
    unknown_or_item_failed: "Do not ask the user to interpret the checker result. Apply the active mode and record staff detail."
    override: "The only user choice point is structured override when institution policy allows it."
  internal_record_must_include:
    - "package or action blocked"
    - "checker verdict and key evidence"
    - "kev_checked, version_exact, source_scope, registry_status, registry_stale when returned"
    - "applied mode and env_grade"
    - "safe replacement package, standard-library path, or approved track change"
    - "safe version if checker provides one"
    - "cooldown wait days when applicable"
    - "review or exception request path when replacement is not possible"
    - "feature impact and residual risk"

release_submission_contract:
  default_submission_materials:
    html_report: "The human-readable HTML report saved by vibecode-checker render_report."
    json_evidence: "The original JSON evidence saved by vibecode-checker render_report/save_report."
  mandatory_notice: "Before deployment or handoff, tell the user the final two checker reports must be submitted to the security team or AX team."
  official_approval_boundary: "The reports are review evidence, not official security approval or production authorization."
  conditional_documents:
    deployment_application: "Only when the institution requires a separate application form."
    exception_request: "Only when unresolved policy/security exceptions exist."
    package_review_request: "Only when package review or exception is required."
    server_install_guide: "Only when operations needs installation handoff."
  forbidden_default_behavior:
    - "Do not create a separate package-evidence JSON by default when checker JSON already contains dependency_audit."
    - "Do not rewrite checker reports into new harness report filenames."
    - "Do not force release candidates to produce deployment applications when the two checker reports satisfy the review handoff."

known_boundaries:
  - "The package gate constrains the normal harness path, but cannot stop direct terminal installs performed outside the harness."
  - "The harness cannot retroactively prove already-installed packages are safe."
  - "The harness cannot control IDE/agent tools that bypass this harness."
  - "Users with filesystem access may edit local policy files; release gates must therefore re-check evidence."
  - "The harness reports registry/checker unavailability but does not implement registry fail-open/fail-safe logic itself; it enforces the checker verdict/result state."
