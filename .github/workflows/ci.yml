# 포털 CI — 체커 설치를 **필수**로 둔다.
#
# 왜 필수인가: 계약 테스트에는 체커가 있어야만 할 수 있는 확인이 있다. 대표적으로
# 골든 fixture 가 설치된 체커 버전과 맞는지 대조하는 것이다. 체커가 없으면 그
# 항목은 건너뛰는데, **건너뛴 항목이 있는 통과는 초록불 아래에서 통과와 구별되지
# 않는다.** fixture 가 낡아도 CI 는 몇 달이고 초록일 수 있다 — 이 CI 가 막으려는
# 바로 그 실패 유형이다.
#
# 그래서 여기서는 체커 설치가 실패하면 작업이 실패하고, 검사에는
# PORTAL_REQUIRE_CHECKER=1 을 줘서 **건너뛰기 자체를 금지**한다.
name: portal-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 새 커밋이 오면 이전 실행은 취소한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 건너뛰기 금지 스위치. 이 값이 없으면 개발 PC 처럼 조용히 건너뛴다.
      PORTAL_REQUIRE_CHECKER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 두 생태계를 모두 쓰므로 두 런타임이 다 필요하다.
      # PyPI 축은 예외 경로가 아니라 npm 축과 대칭인 정식 축이다.
      - name: PyPI 축 런타임 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 체커를 한 번만 받아서 **설치와 재생성에 같은 리비전을 쓴다.**
      # 따로 받으면 설치된 체커와 재생성 스크립트가 다른 커밋일 수 있고,
      # 그러면 버전 대조가 무엇을 대조한 것인지 말할 수 없게 된다.
      # 체커는 **고정된 커밋**으로 받는다. 기본 브랜치를 따라가면 체커가 바뀔
      # 때마다 포털 CI 가 사전 예고 없이 깨지거나, 더 나쁘게는 fixture 가 무엇을
      # 기준으로 검증됐는지 말할 수 없게 된다. 아래 SHA 는 저장된 fixture 의
      # .meta.json 이 가리키는 커밋과 같아야 한다 — 대조 단계가 그것을 확인한다.
      #
      # 체커를 올릴 때의 절차: 체커 커밋 → 그 커밋에서 fixture 재생성 → 여기 SHA
      # 갱신, 세 가지를 한 PR 로 묶는다.
      - name: 체커 저장소 받기
        env:
          CHECKER_REPOSITORY: ${{ vars.CHECKER_REPOSITORY || 'https://github.com/Lex6won/vibecode-checker.git' }}
          CHECKER_COMMIT: ${{ vars.CHECKER_COMMIT || 'a392e5a6f54721bcd0b491116772d8b7bf75d938' }}
        run: |
          if ! printf '%s' "${CHECKER_COMMIT}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "CHECKER_COMMIT 은 40자리 커밋 SHA 여야 합니다(브랜치 이름 불가): '${CHECKER_COMMIT}'" >&2
            exit 1
          fi
          git clone --no-checkout "${CHECKER_REPOSITORY}" "${RUNNER_TEMP}/checker"
          git -C "${RUNNER_TEMP}/checker" checkout --detach "${CHECKER_COMMIT}"
          actual="$(git -C "${RUNNER_TEMP}/checker" rev-parse HEAD)"
          echo "체커 커밋: ${actual}"
          if [ "${actual}" != "${CHECKER_COMMIT}" ]; then
            echo "체크아웃된 커밋(${actual})이 고정값(${CHECKER_COMMIT})과 다릅니다." >&2
            exit 1
          fi

      # 실패하면 여기서 작업이 끝난다 — `|| true` 를 붙이지 않는 것이 요점이다.
      - name: 체커(gvskb) 설치
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${RUNNER_TEMP}/checker"

      # 설치됐다고 말만 하고 넘어가지 않는다 — 실제로 실행해 버전을 찍는다.
      - name: 체커 설치 확인
        run: |
          gvskb version
          echo "PORTAL_REQUIRE_CHECKER=${PORTAL_REQUIRE_CHECKER}"

      - name: 의존성 설치
        run: npm ci

      # npm run check 안에 계약 테스트와 패키지 게이트 두 축 스모크가 들어 있다.
      # PORTAL_REQUIRE_CHECKER=1 이므로 어느 항목도 건너뛸 수 없다.
      - name: 포털 검사
        run: npm run check

      # fixture 가 낡았을 때 "재생성하면 된다"로 끝내지 않고, 재생성이 지금도
      # 되는지 여기서 확인한다. 재생성이 깨져 있으면 낡은 fixture 를 고칠 방법이
      # 없는 것이고, 그 사실은 fixture 가 낡은 날이 아니라 지금 알아야 한다.
      - name: fixture 재생성이 가능한지 확인
        run: |
          python "${RUNNER_TEMP}/checker/scripts/regenerate_portal_fixture.py" \
            --out "${RUNNER_TEMP}/regenerated.json"
          node scripts/fixture-regeneration-check.mjs "${RUNNER_TEMP}/regenerated.json"
