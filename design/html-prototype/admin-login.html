<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인</title>
  <style>
    :root {
      --moon: #f3f6ff;
      --herb: #cef26d;
      --harbor: #3770bf;
      --ink: #102033;
      --panel: #ffffff;
      --soft: #e8f2ff;
      --muted: #40546f;
      --line: #d5e5fb;
      --green: #1f6b5f;
      --warn: #8a5b00;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--moon);
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      word-break: keep-all;
      overflow-wrap: break-word;
      line-break: strict;
      letter-spacing: 0;
    }

    a, button, input { font: inherit; }

    main {
      width: min(1180px, calc(100% - 32px));
      min-height: calc(100vh - 16px);
      margin: 0 auto;
      padding: 8px 0 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }

    .topbar,
    .login-card {
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 18px 45px rgba(55,112,191,.12);
    }

    .topbar {
      min-height: 68px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 12px;
    }

    .back,
    .top-link,
    .button {
      min-height: 38px;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      border: 0;
      background: var(--soft);
      color: #244d85;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      transition: transform .14s ease, box-shadow .14s ease, background-color .14s ease;
    }

    .button {
      min-height: 46px;
      padding: 0 18px;
      background: var(--green);
      color: #ffffff;
      font-size: 15px;
    }

    .back {
      width: 42px;
      height: 42px;
      min-height: 42px;
      padding: 0;
      flex: 0 0 auto;
    }

    .back svg {
      width: 21px;
      height: 21px;
      stroke-width: 2.6;
    }

    .topbar > .top-link {
      margin-left: auto;
    }

    .back:hover,
    .back:focus-visible,
    .top-link:hover,
    .top-link:focus-visible,
    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 10px 22px rgba(55,112,191,.18);
    }

    .back:focus-visible,
    .top-title:focus-visible,
    .top-link:focus-visible,
    .button:focus-visible {
      outline: 3px solid rgba(55,112,191,.28);
      outline-offset: 3px;
    }

    .back:active,
    .top-link:active,
    .button:active {
      transform: translateY(1px) scale(.99);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.34);
    }

    .top-title {
      min-width: 0;
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      flex: 1 1 auto;
      color: inherit;
      text-decoration: none;
      border-radius: 16px;
    }

    .gg-mark {
      width: 70px;
      height: 50px;
      display: grid;
      place-items: center;
      overflow: hidden;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 0 0 1px rgba(55,112,191,.16);
    }

    .gg-mark img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center;
      transform: scale(1.3);
    }

    .top-title strong {
      display: block;
      font-size: 24px;
      line-height: 30px;
      font-weight: 900;
    }

    .top-title span {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 13px;
      line-height: 18px;
      font-weight: 800;
    }

    .content {
      display: grid;
      min-height: calc(100vh - 104px);
      place-items: center;
    }

    .login-card {
      width: min(560px, 100%);
      min-height: 460px;
      padding: 30px;
      display: grid;
      align-content: center;
      gap: 18px;
      outline: 3px solid var(--harbor);
      box-shadow: 0 20px 48px rgba(55,112,191,.16);
    }

    .eyebrow {
      width: fit-content;
      min-height: 30px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      background: var(--soft);
      color: #244d85;
      font-size: 12px;
      font-weight: 900;
    }

    h1 {
      max-width: 620px;
      margin: 0;
      font-size: 29px;
      line-height: 1.22;
      font-weight: 900;
    }

    .login-card p,
    .guide-list li {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
      font-weight: 700;
    }

    .form-grid {
      display: grid;
      gap: 12px;
      max-width: 620px;
    }

    .field {
      min-height: 58px;
      padding: 8px 16px;
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      border-radius: 18px;
      background: var(--moon);
    }

    .field label {
      color: #244d85;
      font-size: 13px;
      font-weight: 900;
      white-space: nowrap;
    }

    .field input {
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    @media (max-width: 960px) {
      main {
        width: calc(100% - 28px);
        padding: 8px 0 12px;
      }

      .topbar {
        align-items: stretch;
        flex-direction: column;
        padding: 14px;
      }

      .content {
        min-height: auto;
      }

      .login-card {
        min-height: 0;
        padding: 22px;
      }

      h1 {
        font-size: 29px;
      }

      .field {
        grid-template-columns: 1fr;
        align-items: start;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .back,
      .top-link,
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">
      <a class="top-title" href="/" aria-label="홈으로 이동">
        <span class="gg-mark" aria-hidden="true"><img src="./assets/images/gyeonggi-signature-ko.jpg" alt=""></span>
        <div>
          <strong>관리자 로그인</strong>
          <span>AI로 만든 개발 소스의 보안 위험을 빠르게 확인합니다.</span>
        </div>
      </a>
    </header>

    <section class="content">
      <div class="login-card">
        <span class="eyebrow">총괄 관리자</span>
        <h1>관리자 계정으로 로그인합니다.</h1>
        <p>전체 기관의 점검 이력, 제출 상태, 보고서 다운로드 이력을 확인합니다.</p>
        <div class="form-grid">
          <div class="field">
            <label for="adminId">아이디</label>
            <input id="adminId" autocomplete="username" placeholder="관리자 아이디">
          </div>
          <div class="field">
            <label for="adminPassword">비밀번호</label>
            <input id="adminPassword" type="password" autocomplete="current-password" placeholder="비밀번호">
          </div>
        </div>
        <div class="actions">
          <a class="button" href="/admin">로그인</a>
          <a class="top-link" href="/help">도움말</a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
