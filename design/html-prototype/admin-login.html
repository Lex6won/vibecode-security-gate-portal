<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>관리자 로그인</title>
  <meta name="description" content="공공 바이브코딩 보안 게이트 포털 관리자 로그인 페이지입니다.">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .content { display: grid; min-height: min(560px, calc(100vh - 140px)); place-items: center; padding: 32px 0; }
    .login-card {
      width: min(480px, 100%);
      padding: 40px;
      display: grid;
      align-content: center;
      gap: 22px;
      border-radius: var(--radius-xl);
      border-color: var(--ice);
      box-shadow: var(--shadow);
      box-shadow: var(--shadow);
      text-align: center;
    }
    .login-card .eyebrow { justify-self: center; }
    .login-card h1 { font-size: 28px; font-weight: 900; line-height: 1.25; }
    .login-card > p { color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.6; }
    .form-grid { display: grid; gap: 16px; text-align: left; }
    .form-grid .field {
      min-height: auto;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      align-items: start;
      background: transparent;
      border-radius: 0;
    }
    .form-grid .field label {
      color: var(--info);
      font-size: 13px;
      font-weight: 900;
    }
    .form-grid .field input {
      min-height: 54px;
      padding: 0 18px;
      border: 2px solid var(--line);
      border-radius: 16px;
      background: var(--panel);
      color: var(--ink);
      font-size: 15px;
      font-weight: 800;
      transition: border-color var(--duration-fast) var(--ease-out),
                  box-shadow var(--duration-fast) var(--ease-out);
    }
    .form-grid .field input:focus {
      border-color: var(--harbor);
      box-shadow: 0 0 0 4px rgba(55, 112, 191, 0.12);
      outline: none;
    }
    .login-error {
      min-height: 22px;
      margin: 0;
      color: var(--danger);
      font-size: 13px;
      font-weight: 900;
      text-align: left;
    }
    .actions { display: block; margin-top: 4px; }
    .actions .button { width: 100%; min-height: 52px; font-size: 16px; }
    @media (max-width: 960px) {
      .content { min-height: auto; padding: 16px 0; }
      .login-card { padding: 28px 22px; }
      .login-card h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <a class="brand-home" href="/" aria-label="홈으로 이동">
        <span class="gg-mark" aria-hidden="true"><img src="/assets/images/gyeonggi-signature-ko.jpg" alt="경기도 로고"></span>
        <span class="brand-copy">
          <strong>관리자 로그인</strong>
          <span>AI로 만든 개발 소스의 보안 위험을 빠르게 확인합니다.</span>
        </span>
      </a>
    </header>

    <section class="content">
      <div class="panel-card login-card">
        <span class="eyebrow">총괄 관리자</span>
        <h1>관리자 계정으로 로그인합니다.</h1>
        <p>전체 기관의 점검 이력, 제출 상태, 보고서 다운로드 이력을 확인합니다.</p>
        <form id="adminLoginForm">
          <div class="form-grid">
            <div class="field">
              <label for="adminId">아이디</label>
              <input id="adminId" name="id" autocomplete="username" placeholder="관리자 아이디" required>
            </div>
            <div class="field">
              <label for="adminPassword">비밀번호</label>
              <input id="adminPassword" name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required>
            </div>
          </div>
          <p class="login-error" id="loginError" role="alert" aria-live="polite"></p>
          <div class="actions">
            <button class="button" id="adminLoginButton" type="submit">로그인</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const adminLoginForm = document.querySelector("#adminLoginForm");
    const adminLoginButton = document.querySelector("#adminLoginButton");
    const loginError = document.querySelector("#loginError");

    async function responseBody(response) {
      const body = await response.text();
      try {
        return body ? JSON.parse(body) : {};
      } catch {
        return {};
      }
    }

    function loginErrorMessage(response, result) {
      if (response.status === 401) return "아이디 또는 비밀번호가 일치하지 않습니다.";
      if (response.status === 404) return "로그인 기능이 현재 실행 중인 포털에 아직 반영되지 않았습니다. 포털을 다시 시작한 뒤 다시 시도하세요.";
      if (response.status >= 500) return "로그인 서비스를 준비하지 못했습니다. 포털을 다시 시작한 뒤 다시 시도하세요.";
      return result.message || "로그인 정보를 확인하지 못했습니다. 잠시 후 다시 시도하세요.";
    }

    adminLoginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      adminLoginButton.disabled = true;
      adminLoginButton.textContent = "확인 중";
      loginError.textContent = "";
      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            id: document.querySelector("#adminId").value.trim(),
            password: document.querySelector("#adminPassword").value
          })
        });
        const result = await responseBody(response);
        if (!response.ok) throw new Error(loginErrorMessage(response, result));
        window.location.assign(result.next || "/admin");
      } catch (error) {
        loginError.textContent = /failed to fetch|networkerror/i.test(String(error.message || ""))
          ? "포털에 연결하지 못했습니다. 포털이 실행 중인지 확인한 뒤 다시 시도하세요."
          : (error.message || "로그인 정보를 확인하지 못했습니다. 잠시 후 다시 시도하세요.");
        adminLoginButton.disabled = false;
        adminLoginButton.textContent = "로그인";
      }
    });
  </script>
</body>
</html>
