<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 점검 이력 · 공공 바이브코딩 보안 게이트</title>
  <meta name="description" content="내가 요청한 보안 점검의 결과와 보고서, 보안성검토 요청 상태를 확인합니다.">
  <link rel="stylesheet" href="/shared.css">
  <style>
    .history-table { width: 100%; min-width: 1000px; table-layout: fixed; border-collapse: collapse; font-size: 13.5px; }
    .history-table th, .history-table td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .history-table th { font-size: 12px; color: var(--muted); font-weight: 900; }
    .history-table th:nth-child(1) { width: 120px; }
    .history-table th:nth-child(2) { width: 260px; }
    .history-table th:nth-child(3) { width: 54px; }
    .history-table th:nth-child(4) { width: 74px; }
    .history-table th:nth-child(5) { width: 360px; }
    .history-table th:nth-child(6) { width: 136px; }
    .history-table .decision { font-weight: 900; }
    .history-table a { color: var(--harbor); font-weight: 800; text-decoration: none; }
    .table-wrap { overflow-x: auto; }
    .target-name { display: block; color: var(--ink); font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .target-type { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .target-source { display: block; margin-top: 3px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .artifact-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .artifact-link { display: inline-flex; align-items: center; min-height: 28px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); font-size: 12px; line-height: 1.2; }
    .artifact-link.submission { background: var(--green-soft); border-color: #a9d9cf; color: var(--green); }
    .artifact-guide { margin: 0 0 10px; color: var(--muted); font-size: 12.5px; font-weight: 700; }
    .history-table tr.focused-scan td { background: #effaf6; }
    .empty-note { padding: 18px; font-size: 14px; color: var(--muted); font-weight: 700; }
    .profile-card { margin-top: 16px; }
    .profile-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; margin-top: 14px; }
    .profile-field { display: grid; gap: 6px; min-width: 180px; }
    .profile-field span { font-size: 12px; color: var(--muted); font-weight: 900; }
    .profile-row input { padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-md); font-size: 14px; min-width: 160px; }
    .mini-note { font-size: 12.5px; color: var(--muted); font-weight: 700; margin-top: 8px; }
    .review-button { padding: 6px 12px; font-size: 12.5px; border-radius: var(--radius-md); border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 800; }
    .review-button:disabled { opacity: 0.6; cursor: default; }
  </style>
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <a class="brand-home" href="/" aria-label="홈으로 이동">
        <span class="gg-mark" aria-hidden="true"><img src="/assets/images/gyeonggi-signature-ko.jpg" alt="경기도 로고"></span>
        <span class="brand-copy">
          <strong>내 점검 이력</strong>
          <span>내가 요청한 점검의 결과와 검토 상태</span>
        </span>
      </a>
      <div style="display:flex; gap:8px; align-items:center;">
        <a class="pill" href="/scan">새 점검</a>
        <button class="pill" id="toggleProfile" type="button" style="cursor:pointer; border:1px solid var(--line); background:var(--panel);" hidden>소속 수정</button>
        <button class="pill" id="logoutButton" type="button" style="cursor:pointer; border:1px solid var(--line); background:var(--panel);" hidden>로그아웃</button>
      </div>
    </header>

    <section class="panel-card" id="loginNeeded" hidden>
      <h2 class="section-title">접속 인증을 확인하지 못했습니다</h2>
      <p class="empty-note">이력은 본인만 볼 수 있습니다. 새로고침한 뒤 다시 시도해 주세요.</p>
    </section>

    <section class="panel-card" id="historyCard" hidden aria-labelledby="history-title">
      <h2 class="section-title" id="history-title">점검 이력</h2>
      <p class="artifact-guide">결과 리포트와 목록은 새 창에서 보고, 보안성검토 제출자료 ZIP은 내려받습니다.</p>
      <div class="table-wrap">
        <table class="history-table" aria-label="내 점검 이력">
          <thead>
            <tr><th>일시</th><th>대상</th><th>방식</th><th>결과</th><th>산출물</th><th>보안성검토</th></tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
      <p class="empty-note" id="historyEmpty" hidden>아직 점검 이력이 없습니다. 첫 점검을 시작해 보세요.</p>
    </section>

    <section class="panel-card profile-card" id="profileCard" hidden aria-labelledby="profile-title">
      <h2 class="section-title" id="profile-title">소속 정보 수정</h2>
      <p class="mini-note" id="profileWho">확인 중</p>
      <div class="profile-row">
        <label class="profile-field"><span>기관명</span><input id="profileOrganization" aria-label="기관명" placeholder="예: 경기도청"></label>
        <label class="profile-field"><span>부서명</span><input id="profileDepartment" aria-label="부서명" placeholder="예: AI산업육성과"></label>
        <button class="ghost-button" id="saveProfile" type="button">저장</button>
      </div>
      <p class="mini-note">이미 만든 점검 이력의 소속 기록은 바뀌지 않습니다.</p>
    </section>
  </main>

  <script>
    const loginNeeded = document.querySelector("#loginNeeded");
    const profileCard = document.querySelector("#profileCard");
    const historyCard = document.querySelector("#historyCard");
    const historyBody = document.querySelector("#historyBody");
    const focusedScanId = new URLSearchParams(window.location.search).get("scan");
    const historyEmpty = document.querySelector("#historyEmpty");
    const profileWho = document.querySelector("#profileWho");
    const profileOrganization = document.querySelector("#profileOrganization");
    const profileDepartment = document.querySelector("#profileDepartment");
    const saveProfile = document.querySelector("#saveProfile");
    const toggleProfile = document.querySelector("#toggleProfile");
    const logoutButton = document.querySelector("#logoutButton");
    let accessLoginInFlight = false;

    const decisionLabels = {
      allow: "제출 가능",
      quick_complete: "고위험 없음",
      needs_review: "검토 필요",
      blocked: "수정 필요",
      incomplete: "재점검 필요"
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value || "-";
      const pad = (number) => String(number).padStart(2, "0");
      return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
    }

    function reviewCell(scan) {
      if (scan.review_request) {
        return `<span class="pill">요청됨 · ${formatDate(scan.review_request.requested_at)}</span>`;
      }
      if (scan.status !== "completed") return "<span>-</span>";
      return `<button class="review-button" data-review="${scan.id}" type="button">검토 요청</button>`;
    }

    function artifactDisplayName(report) {
      if (report.kind === "html_report") return "결과 리포트";
      if (report.kind === "json_report") return "패키지 목록·점검 데이터";
      if (report.kind === "sbom") return "소프트웨어 명세서";
      if (report.kind === "review_request") return "보안성검토 요청서";
      if (report.kind === "submission_package") return "보안성검토 제출자료 ZIP";
      if (String(report.file_name || "").endsWith(".md")) return "결과 요약";
      return "점검 산출물";
    }

    function targetDetails(scan) {
      const source = String(scan.target_name || scan.target_label || "");
      if (scan.target_type === "github_url") {
        const parts = source.split(/[\\/\s]+/).filter(Boolean);
        const normalizedSource = parts[0] === "https" && parts[1]?.includes(".")
          ? `https://${parts.slice(1).join("/")}`
          : source;
        const repository = normalizedSource.split("/").filter(Boolean).at(-1) || "Git 저장소";
        return { name: repository, type: "Git 저장소", source: normalizedSource };
      }
      if (scan.target_type === "browser_archive") return { name: source || "압축파일", type: "압축파일", source: "" };
      return { name: source || "프로젝트 폴더", type: "프로젝트 폴더", source: "" };
    }

    function renderScans(scans) {
      historyBody.innerHTML = "";
      historyEmpty.hidden = scans.length > 0;
      for (const scan of scans) {
        const row = document.createElement("tr");
        if (scan.id === focusedScanId) {
          row.classList.add("focused-scan");
          row.tabIndex = -1;
        }
        const artifacts = scan.artifacts || scan.reports || [];
        const reports = artifacts.map((report) => {
          const packageFile = report.kind === "submission_package" || String(report.file_name || "").endsWith(".zip");
          const href = packageFile ? report.url : `${report.url}?view=1`;
          const attributes = packageFile ? "download" : 'target="_blank" rel="noreferrer"';
          const className = packageFile ? "artifact-link submission" : "artifact-link";
          const action = packageFile ? "내려받기" : "새 창에서 보기";
          return `<a class="${className}" href="${escapeHtml(href)}" ${attributes} title="${escapeHtml(report.file_name)} ${action}">${escapeHtml(artifactDisplayName(report))}</a>`;
        }).join("");
        const target = targetDetails(scan);
        const decision = scan.status === "failed" ? "점검 실패"
          : scan.status !== "completed" ? "진행 중"
          : decisionLabels[scan.decision] || scan.decision;
        row.innerHTML = `
          <td>${escapeHtml(formatDate(scan.created_at))}</td>
          <td><span class="target-name" title="${escapeHtml(target.name)}">${escapeHtml(target.name)}</span><span class="target-type">${escapeHtml(target.type)}</span>${target.source ? `<span class="target-source" title="${escapeHtml(target.source)}">${escapeHtml(target.source)}</span>` : ""}</td>
          <td>${scan.mode === "quick" ? "간편" : "표준"}</td>
          <td class="decision">${escapeHtml(decision)}</td>
          <td>${reports ? `<div class="artifact-list">${reports}</div>` : "-"}</td>
          <td>${reviewCell(scan)}</td>`;
        historyBody.appendChild(row);
      }
      const focusedRow = historyBody.querySelector(".focused-scan");
      if (focusedRow) {
        window.setTimeout(() => focusedRow.scrollIntoView({ block: "center" }), 0);
      }
    }

    historyBody.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-review]");
      if (!button) return;
      button.disabled = true;
      button.textContent = "요청 중";
      try {
        const response = await fetch(`/api/scan/${button.dataset.review}/request-review`, { method: "POST" });
        if (response.ok) {
          await loadScans();
        } else {
          const result = await response.json();
          button.disabled = false;
          button.textContent = "검토 요청";
          alert(result.message || "요청하지 못했습니다.");
        }
      } catch {
        button.disabled = false;
        button.textContent = "검토 요청";
      }
    });

    saveProfile.addEventListener("click", async () => {
      saveProfile.disabled = true;
      try {
        const response = await fetch("/api/auth/profile", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            organization: profileOrganization.value.trim(),
            department: profileDepartment.value.trim()
          })
        });
        const result = await response.json();
        if (response.ok) {
          profileWho.textContent = `${profileWho.dataset.email} · ${result.organization} ${result.department} (수정됨)`;
        } else {
          alert(result.message || "수정하지 못했습니다.");
        }
      } catch {
        alert("수정하지 못했습니다. 연결을 확인해 주세요.");
      } finally {
        saveProfile.disabled = false;
      }
    });

    logoutButton.addEventListener("click", async () => {
      try { await fetch("/api/auth/logout", { method: "POST" }); } catch {}
      window.location.href = "/scan";
    });

    toggleProfile.addEventListener("click", () => {
      profileCard.hidden = !profileCard.hidden;
      if (!profileCard.hidden) profileOrganization.focus();
    });

    async function loadScans() {
      const response = await fetch("/api/my/scans", { cache: "no-store" });
      if (!response.ok) return;
      const data = await response.json();
      renderScans(data.scans || []);
    }

    async function establishAccessSession() {
      if (accessLoginInFlight) return null;
      accessLoginInFlight = true;
      try {
        let response = await fetch("/api/auth/access-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({})
        });
        if (response.status === 404) {
          response = await fetch("/api/auth/development-login", { method: "POST" });
        }
        if (!response.ok) return null;
        return await (await fetch("/api/auth/session", { cache: "no-store" })).json();
      } catch {
        return null;
      } finally {
        accessLoginInFlight = false;
      }
    }

    async function applySession(session) {
      if (!session?.logged_in) {
        loginNeeded.hidden = false;
        historyCard.hidden = true;
        profileCard.hidden = true;
        toggleProfile.hidden = true;
        logoutButton.hidden = true;
        return;
      }
      loginNeeded.hidden = true;
      historyCard.hidden = false;
      toggleProfile.hidden = false;
      logoutButton.hidden = false;
      profileWho.dataset.email = session.email;
      profileWho.textContent = session.email;
      profileOrganization.value = session.organization || "";
      profileDepartment.value = session.department || "";
      await loadScans();
    }

    (async function init() {
      try {
        let session = await (await fetch("/api/auth/session", { cache: "no-store" })).json();
        if (!session.logged_in && (session.access_email || window.location.hostname === "127.0.0.1" || window.location.hostname === "localhost")) {
          session = await establishAccessSession() || session;
        }
        await applySession(session);
      } catch {
        await applySession(null);
      }
    })();
  </script>
</body>
</html>
